name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Protocol library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make host-test

  converter:
    name: Zigbee2MQTT converter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make z2m-test

  dashboards:
    name: Dashboard files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make dashboard-check

  firmware:
    name: Firmware build (ESP-IDF v5.5.6, ESP32-C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c6
          path: firmware
